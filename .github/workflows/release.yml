name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build extension zip
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          zip -r quiet-tab-${{ steps.version.outputs.version }}.zip \
            manifest.json \
            index.html \
            styles.css \
            app.js \
            solar.js \
            solar-model.js \
            weather.js \
            vendor/ \
            assets/ \
            icons/

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Quiet New Tab ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: quiet-tab-${{ steps.version.outputs.version }}.zip
